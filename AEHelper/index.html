<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>TaskTimer Helper</title>
<style>
  html, body { margin: 0; background: #232323; color: #bbb; font: 12px -apple-system, BlinkMacSystemFont, sans-serif; }
  #status { padding: 8px 10px; }
  .bad { color: #ff9f0a; }
</style></head>
<body>
<div id="status">TaskTimer Helper starting…</div>
<script>
// TaskTimer Helper: see AEBridge.swift in TaskTimer.
function show(text, bad) {
  var el = document.getElementById('status');
  if (el) { el.textContent = text; el.className = bad ? 'bad' : ''; }
}
window.onerror = function (msg) { show('TaskTimer Helper error: ' + msg, true); };
try {
var fs = require('fs'), path = require('path'), os = require('os');
var base = path.join(os.homedir(), 'Library', 'Application Support', 'TaskTimer Dev', 'AE');
var req = path.join(base, 'requests');
try { fs.mkdirSync(req, { recursive: true }); } catch (e) {}

function evalScript(s, cb) { window.__adobe_cep__.evalScript(s, cb); }
function busyAnswer(r) { return r === undefined || r === null || r === 'EvalScript error.'; }

// Two copies can run (the hidden background one and the panel in Window → Extensions);
// only one of them, the leader, does the work.
var me = Math.random().toString(36).slice(2);
var lockFile = path.join(base, 'leader');
function isLeader() {
  var now = Date.now();
  try {
    var parts = fs.readFileSync(lockFile, 'utf8').split(' ');
    if (parts[0] !== me && now - Number(parts[1]) < 3500) return false;
  } catch (e) {}
  try { fs.writeFileSync(lockFile, me + ' ' + now); } catch (e) {}
  return true;
}
var leader = false;

// Heartbeat: TaskTimer only sends scripts this way while this file is fresh.
setInterval(function () {
  leader = isLeader();
  show(leader ? 'Connected to TaskTimer ✓' : 'Connected to TaskTimer ✓ (through the other copy)');
  if (!leader) return;
  try { fs.writeFileSync(path.join(base, 'alive'), String(Date.now())); } catch (e) {}
}, 1000);

// Scripts TaskTimer asked for, one at a time, oldest first.
var running = false;
function nextRequest() {
  if (running || !leader) return;
  var files;
  try { files = fs.readdirSync(req).filter(function (f) { return /\.jsx$/.test(f); }); } catch (e) { return; }
  if (!files.length) return;
  files.sort(function (a, b) {
    try { return fs.statSync(path.join(req, a)).mtimeMs - fs.statSync(path.join(req, b)).mtimeMs; } catch (e) { return 0; }
  });
  var id = files[0].replace(/\.jsx$/, '');
  var src = path.join(req, id + '.jsx'), work = path.join(req, id + '.run');
  try { fs.renameSync(src, work); } catch (e) { return; }
  var code;
  try { code = fs.readFileSync(work, 'utf8'); } catch (e) { return; }
  var literal = JSON.stringify(code).replace(/ /g, '\\u2028').replace(/ /g, '\\u2029');
  var wrapped = '(function(){try{var r=eval(' + literal + ');return (r===undefined||r===null)?"":String(r);}' +
                'catch(e){return "TT_ERROR:"+e.toString()+(e.line?" (line "+e.line+")":"");}})()';
  running = true;
  evalScript(wrapped, function (res) {
    running = false;
    if (busyAnswer(res)) {
      // After Effects couldn't run it now (one of its windows is open): try again shortly.
      try { fs.renameSync(work, src); } catch (e) {}
      return;
    }
    try { fs.writeFileSync(path.join(req, id + '.result'), res); } catch (e) {}
    try { fs.unlinkSync(work); } catch (e) {}
    nextRequest();
  });
}
setInterval(nextRequest, 400);

// Every 5 s, only while "renders to the task's Render folder" is on: Render Queue outputs.
var ticking = false;
setInterval(function () {
  if (ticking || running || !leader) return;
  var cfg = { render: true, naming: true };
  try { cfg = JSON.parse(fs.readFileSync(path.join(base, 'config.json'), 'utf8')); } catch (e) {}
  if (!cfg.render) return;
  ticking = true;
  evalScript('TaskTimerTick({render:true,naming:' + !!cfg.naming + '})', function () { ticking = false; });
}, 5000);
} catch (e) {
  show('TaskTimer Helper could not start: ' + e, true);
}
</script>
</body></html>
