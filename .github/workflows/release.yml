name: Build & Release

# Every push to main builds TaskTimer on a Mac. When Resources/VERSION is new,
# the build is published as a release and every installed TaskTimer offers the update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Apple Silicon Mac runners are often full; the Intel ones build the same universal app.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Test the .aep reader (Collect)
        run: |
          git clone -q --depth 1 https://github.com/boltframe/aftereffects-aep-parser.git /tmp/aepsamples || true
          xcrun swiftc -O Sources/AEPFile.swift Tests/AEPFileTest/main.swift -o /tmp/aeptest
          /tmp/aeptest /tmp/aepsamples/data/*.aep

      - name: Sign the After Effects helper
        # Self-signed with Adobe's ZXPSignCmd, so After Effects loads it without lowering any
        # of its security settings. The signed files replace AEHelper/ for the build below.
        run: |
          set -e
          curl -fsSL -o /tmp/ZXPSignCmd https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/master/ZXPSignCMD/4.1.3/macOS/ZXPSignCmd
          chmod +x /tmp/ZXPSignCmd
          PW="$(openssl rand -hex 16)"
          find AEHelper -name .DS_Store -delete
          /tmp/ZXPSignCmd -selfSignedCert EG Cairo TaskTimer "TaskTimer Helper" "$PW" /tmp/aehelper.p12 -validityDays 3650
          mkdir -p build
          /tmp/ZXPSignCmd -sign AEHelper build/AEHelper.zxp /tmp/aehelper.p12 "$PW" -tsa http://timestamp.digicert.com \
            || /tmp/ZXPSignCmd -sign AEHelper build/AEHelper.zxp /tmp/aehelper.p12 "$PW"
          /tmp/ZXPSignCmd -verify build/AEHelper.zxp
          rm -rf AEHelper && mkdir AEHelper && unzip -q build/AEHelper.zxp -d AEHelper
          test -f AEHelper/META-INF/signatures.xml

      - name: Build TaskTimer.app (Apple Silicon + Intel)
        run: TT_CI=1 bash "Build TaskTimer.command"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d ' \n\r' < Resources/VERSION)"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V is already released. Bump Resources/VERSION to ship an update."
            exit 0
          fi
          # Notes = the newest section of CHANGELOG.md
          awk '/^## /{n++} n==1' CHANGELOG.md > build/NOTES.txt
          [ -s build/NOTES.txt ] || echo "TaskTimer $V" > build/NOTES.txt
          (cd ChromeExtension && zip -qr ../build/TaskTimer-Chrome.zip .)
          gh release create "v$V" build/TaskTimer.app.zip build/VERSION build/NOTES.txt build/TaskTimer-Chrome.zip \
            --title "TaskTimer $V" --notes-file build/NOTES.txt --latest
